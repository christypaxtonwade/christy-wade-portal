<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recover Your Signals Reading — Christy Paxton Wade</title>
<style>
  :root { --bg: #14110a; --vellum: #e8dcbb; --gold: #7a5618; --gold-bright: #c89a3c; --muted: rgba(232,220,187,0.65); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--vellum); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; line-height: 1.7; min-height: 100vh; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 96px 24px; }
  h1 { font-size: 30px; font-weight: 500; letter-spacing: 0.02em; margin-bottom: 16px; }
  p { font-size: 17px; line-height: 1.7; margin-bottom: 24px; color: rgba(232,220,187,0.88); }
  label { display: block; font-family: 'Jost', sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  input[type="email"] { width: 100%; padding: 12px 14px; background: rgba(232,220,187,0.06); border: 1px solid rgba(232,220,187,0.25); color: var(--vellum); font-family: inherit; font-size: 17px; border-radius: 2px; margin-bottom: 24px; }
  button { padding: 14px 32px; background: var(--gold); color: var(--vellum); border: none; font-family: 'Jost', sans-serif; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
  button:hover { background: var(--gold-bright); color: var(--bg); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .msg { margin-top: 24px; padding: 16px; background: rgba(232,220,187,0.06); border-left: 2px solid var(--gold); font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Recover your reading</h1>
  <p>Enter the email you used when you purchased your Signals Reading. We'll send the permanent link to that inbox.</p>
  <form id="recoverForm">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="you@example.com">
    <button type="submit" id="submitBtn">Send me the link</button>
    <div class="msg" id="msg" style="display:none"></div>
  </form>
</div>

<script>
const SUPABASE_URL = 'https://egldaiqrwuxqgavjwwim.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbGRhaXFyd3V4cWdhdmp3d2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzkxMTMsImV4cCI6MjA5MTQxNTExM30.jVZvPEPP4f78OfbaWBAryGPd4N_b16FKY92NXi-CeeA';

document.getElementById('recoverForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = 'Sending…';
  msg.style.display = 'none';

  try {
    const email = document.getElementById('email').value.trim();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/recover-signals-link`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` },
      body: JSON.stringify({ email })
    });
    msg.style.display = 'block';
    msg.textContent = "If that email matched a purchased reading, the link is on its way. Check your inbox in a minute or two.";
  } catch (err) {
    msg.style.display = 'block';
    msg.textContent = "Something went wrong. Please try again, or email christy@christypaxtonwade.com.";
  } finally {
    btn.disabled = false; btn.textContent = 'Send me the link';
  }
});
</script>
</body>
</html>
