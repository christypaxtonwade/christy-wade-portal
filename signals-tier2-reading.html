<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Signals Reading — Christy Paxton Wade</title>
<style>
  :root {
    --bg: #e8dcbb;
    --ink: #14110a;
    --gold: #7a5618;
    --muted: rgba(20,17,10,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; line-height: 1.8; min-height: 100vh; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 64px 32px 96px; }
  .header { text-align: center; padding-bottom: 32px; border-bottom: 1px solid rgba(20,17,10,0.18); margin-bottom: 48px; }
  h1 { font-size: 32px; font-weight: 500; letter-spacing: 0.02em; }
  .subtitle { font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  h2 { font-size: 22px; font-weight: 500; letter-spacing: 0.01em; color: var(--gold); margin: 48px 0 16px; }
  .section-text { font-size: 18px; line-height: 1.85; white-space: pre-wrap; }
  .actions { margin-top: 64px; padding-top: 32px; border-top: 1px solid rgba(20,17,10,0.18); display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 12px 24px; background: var(--gold); color: var(--bg); border: none; font-family: 'Jost', sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; text-decoration: none; border-radius: 2px; }
  .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
  .loading, .error { text-align: center; padding: 96px 0; color: var(--muted); font-style: italic; }
  .meta { text-align: center; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-top: 48px; }
  @media print {
    .actions, .meta { display: none; }
    body { background: white; }
    .wrap { padding: 32px; max-width: 100%; }
  }
  .btn[disabled] { opacity: 0.55; pointer-events: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Your Signals Reading</h1>
    <div class="subtitle">Christy Paxton Wade · Navigation Map</div>
  </div>
  <div id="content"><div class="loading">Loading your reading…</div></div>
  <div class="meta">A permanent link to this reading was sent to your email. Save the link if you want to return.</div>
</div>

<script>
const SUPABASE_URL = 'https://egldaiqrwuxqgavjwwim.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbGRhaXFyd3V4cWdhdmp3d2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzkxMTMsImV4cCI6MjA5MTQxNTExM30.jVZvPEPP4f78OfbaWBAryGPd4N_b16FKY92NXi-CeeA';

function getToken() {
  const m = window.location.pathname.match(/\/signals\/reading\/([a-f0-9]{32})/);
  if (m) return m[1];
  const params = new URLSearchParams(window.location.search);
  return params.get('token');
}

async function loadReading() {
  const token = getToken();
  const content = document.getElementById('content');
  if (!token) { content.innerHTML = '<div class="error">No reading link found. <a href="/signals/recover">Recover your link</a>.</div>'; return; }

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/signals_tier2_readings?magic_link_token=eq.${encodeURIComponent(token)}&select=field_walking_text,register_frequencies_text,threshold_asking_text,created_at`,
      { headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` } }
    );
    const rows = await res.json();
    if (!rows || rows.length === 0) {
      content.innerHTML = '<div class="error">This link doesn\'t match any reading. It may have expired or the URL may be incorrect. <a href="/signals/recover">Recover your link</a>.</div>';
      return;
    }
    const reading = rows[0];

    // Stamp viewed_at (fire-and-forget)
    fetch(`${SUPABASE_URL}/rest/v1/signals_tier2_readings?magic_link_token=eq.${encodeURIComponent(token)}`, {
      method: 'PATCH',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ viewed_at: new Date().toISOString() })
    }).catch(() => {});

    const sections = [
      { heading: "The Field You're Walking", body: reading.field_walking_text || '' },
      { heading: 'The Register and the Frequencies Surfacing', body: reading.register_frequencies_text || '' },
      { heading: 'What the Threshold Is Asking', body: reading.threshold_asking_text || '' },
    ];
    window.__readingData = {
      sections,
      dateStr: reading.created_at ? new Date(reading.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : '',
    };

    content.innerHTML = `
      <h2>The Field You're Walking</h2>
      <div class="section-text">${escapeHtml(reading.field_walking_text || '')}</div>
      <h2>The Register and the Frequencies Surfacing</h2>
      <div class="section-text">${escapeHtml(reading.register_frequencies_text || '')}</div>
      <h2>What the Threshold Is Asking</h2>
      <div class="section-text">${escapeHtml(reading.threshold_asking_text || '')}</div>
      <div class="actions">
        <button class="btn" onclick="downloadReadingPdf(this)">Download PDF</button>
        <a class="btn btn-outline" href="/begin">Continue with Christy</a>
      </div>
    `;
  } catch (err) {
    content.innerHTML = `<div class="error">Couldn't load your reading: ${escapeHtml(err.message || String(err))}. <a href="/signals/recover">Recover your link</a>.</div>`;
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Shared one-click reading PDF builder. Lays out a clean, paginated, branded
// document (paragraphs kept whole across page breaks) and downloads it.
function buildReadingPdf(opts) {
  if (typeof html2pdf === 'undefined') { alert('PDF tool is still loading — give it a moment and try again.'); return false; }
  const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const wrap = document.createElement('div');
  wrap.style.cssText = "width:700px;padding:54px 60px;background:#fbf7ec;color:#14110a;font-family:Georgia,'Times New Roman',serif;";
  const sectionsHtml = (opts.sections || []).map(s => {
    const paras = String(s.body || '').split(/\n{2,}/).filter(p => p.trim())
      .map(p => `<p style="margin:0 0 11px;font-size:13px;line-height:1.72;page-break-inside:avoid;">${esc(p.trim())}</p>`).join('');
    return `<h2 style="font-size:15px;color:#7a5618;font-weight:bold;margin:24px 0 9px;page-break-after:avoid;">${esc(s.heading)}</h2>${paras}`;
  }).join('');
  wrap.innerHTML =
    `<div style="text-align:center;border-bottom:1px solid #d8c79a;padding-bottom:20px;margin-bottom:8px;">
       <div style="font-size:25px;font-weight:bold;letter-spacing:.02em;">${esc(opts.title || 'Signals Reading')}</div>
       <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7a5618;margin-top:7px;">Christy Paxton Wade &middot; Navigation Map</div>
       ${opts.name ? `<div style="font-size:13px;color:#5c5644;margin-top:11px;">${esc(opts.name)}</div>` : ''}
       ${opts.dateStr ? `<div style="font-size:10px;letter-spacing:.05em;color:#9a9078;margin-top:3px;">${esc(opts.dateStr)}</div>` : ''}
     </div>${sectionsHtml}`;
  document.body.appendChild(wrap);
  html2pdf().set({
    margin: [12, 0, 16, 0],
    filename: opts.filename || 'signals-reading.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, backgroundColor: '#fbf7ec', windowWidth: 820 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'avoid-all'] },
  }).from(wrap).save().then(() => wrap.remove()).catch(e => { wrap.remove(); alert('PDF failed: ' + (e && e.message || e)); });
  return true;
}

function downloadReadingPdf(btn) {
  const d = window.__readingData;
  if (!d) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Preparing…'; }
  buildReadingPdf({ title: 'Your Signals Reading', dateStr: d.dateStr, sections: d.sections, filename: 'signals-reading.pdf' });
  if (btn) setTimeout(() => { btn.disabled = false; btn.textContent = 'Download PDF'; }, 2500);
}

loadReading();
</script>
</body>
</html>
